# Edges are stored ONCE in active voice. Inverses are derived at load time, never stored.
#
# Hand-maintained. Edges an implemented rule can recompute do NOT belong here — they live in
# derived.yaml, which derive_edges.py rewrites in full. The `derived` edges that remain below
# name rules that are not implemented yet, so nothing can reproduce them; validate_trace.py
# counts them as unverified rather than as evidence (metrics.derived_unverified).
schema_version: "1.0"
scope: ".specify"

edges:
  # intent chain
  - from: REQ-AUTH-0014
    relation: refines
    to: BUS-OBJ-0017
    provenance: asserted
  - from: NON-FR-AUTH-0017
    relation: refines
    to: BUS-OBJ-0017
    provenance: asserted
  - from: USR-STR-0014
    relation: refines
    to: REQ-AUTH-0014
    provenance: asserted

  # design decision: the ADR answers the requirement it was taken for (s20)
  - from: ADR-0019
    relation: refines
    to: REQ-AUTH-0014
    provenance: asserted

  # work chain
  - from: WBS-1.2.3.4.1.1.1
    relation: implements
    to: REQ-AUTH-0014
    provenance: asserted
  - from: WBS-1.2.3.4.1.1.2
    relation: implements
    to: REQ-AUTH-0014
    provenance: asserted
  - from: WBS-1.2.3.4.1.1.2
    relation: implements
    to: NON-FR-AUTH-0017
    provenance: asserted
  - from: WBS-1.2.3.4.1.1.3
    relation: implements
    to: REQ-AUTH-0014
    provenance: asserted
  - from: WBS-1.2.3.4.1.1.2
    relation: mitigates
    to: RISK-0007
    provenance: asserted
  # verification chain
  - from: AC-AUTH-0014-0003
    relation: verifies
    to: REQ-AUTH-0014
    provenance: asserted
  - from: AC-AUTH-0014-0004
    relation: verifies
    to: NON-FR-AUTH-0017
    provenance: asserted
  - from: TC-AUTH-0031
    relation: verifies
    to: REQ-AUTH-0014
    provenance: asserted

  # implementation chain
  #
  # These two are `asserted`, not `derived`. They used to name `task-modifies-closure` — a rule
  # that closed source -> requirement through the task that modified the file. There is no task
  # layer: s15 already defines WBS L7 as the executable task, and a parallel TASK-* identity was
  # a second name for one thing. With the layer gone the rule is not merely unimplemented, it is
  # unwritable, so the honest label for "this file implements this requirement" is a claim.
  - from: src/security/certificate_validator.ts
    relation: implements
    to: REQ-AUTH-0014
    provenance: asserted
  - from: src/security/certificate_validator.ts
    relation: conforms-to
    to: CONTRACT-AUTH-0001
    provenance: derived
    derived_by: openapi-operation-scan
  - from: src/auth/authentication_service.ts
    relation: implements
    to: REQ-AUTH-0014
    provenance: asserted

  # evidence
  - from: EVID-0001
    relation: evidences
    to: WBS-1.2.3.4.1.1.2
    provenance: derived
    derived_by: evidence-manifest-scan
  - from: EVID-0001
    relation: evidences
    to: RISK-0007
    provenance: derived
    derived_by: evidence-manifest-scan
