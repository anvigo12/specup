# Work Breakdown Structure — canonical machine-readable form.
#
# ANSWERS
#   what work exists, who owns it, where it sits in the lifecycle, and what governs it.
#   WBS L7 IS the executable task (s15) — there is no separate task id anywhere in this
#   system.
#
# DOES NOT ANSWER
#   what order the work happens in, or when. `dependencies` records what must precede
#   what; nothing here is a schedule, and a plan that reads like one is being maintained
#   twice.
#
# FILLED IN BADLY WHEN
#   the tree is deep and the leaves are narrative. Seven levels of heading with nothing
#   executable at the bottom is a document, not a plan. The opposite failure is a leaf
#   at L3 — levels 1 to 3 are pure structure, and a leaf there means the plan is empty
#   rather than concise.
#
# CHECKED BY
#   WBS-001 (declared level equals the id's segment count), WBS-002 (parentage is the id
#   minus its last segment), WBS-003 (exactly one root), WBS-004 (leaf depth and
#   terminal_reason), WBS-005/006/007 (every requirement, risk and acceptance id
#   resolves), WBS-009 (no dependency cycles), WBS-010 (iteration letter matches phase).
#   WBS-011 WARNS on a parent with too many children. NOTHING checks whether the work is
#   the right work.
#
# AUTHORITY
#   the node owner. The plan is not an approval artifact — what needs a named human is
#   the requirement baseline the work serves, not the work breakdown.
#
# wbs.md is a GENERATED view of this file (specup.md s47). Edit this file; never edit both.
#
# Levels are semantic, and the id encodes the level — the number of dotted segments IS the
# level, so WBS-1.2.3 is always L3:
#
#   L1  Program / Product          L5  Requirement / User Story
#   L2  OpenUP Phase               L6  Engineering Work Package
#   L3  Iteration                  L7  Executable Task
#   L4  Capability / Feature
#
# Under depth_policy 'semantic' (the default) a leaf may stop above L7 if it declares a
# terminal_reason. Under 'strict' every leaf must be L7.

schema_version: "1.0"
program: "REPLACE-WITH-PROGRAM-NAME"
depth_policy: semantic

nodes:
  - id: WBS-1
    name: "REPLACE-WITH-PROGRAM-NAME"
    level: 1
    status: planned
    kind: structural
    owner: "REPLACE-WITH-OWNER"

  # - id: WBS-1.1
  #   name: "Inception"
  #   level: 2
  #   parent: WBS-1
  #   phase: INCEPTION
  #   status: planned
  #   kind: structural
  #   owner: "project-manager"

  # An L7 executable task. These requirements are enforced, not advisory:
  #   owner, iteration, and at least one requirement are mandatory at L7.
  #
  # `skills:` names the capability contracts this work needs (s8, s28) — the directories under
  # skills/. A named skill that does not exist blocks the task (DOR-009) and fails CTX-004.
  # - id: WBS-1.1.1.1.1.1.1
  #   name: "Implement X"
  #   level: 7
  #   parent: WBS-1.1.1.1.1.1
