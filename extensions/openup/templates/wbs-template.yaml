# Work Breakdown Structure — canonical machine-readable form.
#
# wbs.md is a GENERATED view of this file (specup.md s47). Edit this file; never edit both.
#
# Levels are semantic, and the id encodes the level — the number of dotted segments IS the
# level, so WBS-1.2.3 is always L3:
#
#   L1  Program / Product          L5  Requirement / User Story
#   L2  OpenUP Phase               L6  Engineering Work Package
#   L3  Iteration                  L7  Executable Task
#   L4  Capability / Feature
#
# Under depth_policy 'semantic' (the default) a leaf may stop above L7 if it declares a
# terminal_reason. Under 'strict' every leaf must be L7.

schema_version: "1.0"
program: "REPLACE-WITH-PROGRAM-NAME"
depth_policy: semantic

nodes:
  - id: WBS-1
    name: "REPLACE-WITH-PROGRAM-NAME"
    level: 1
    status: planned
    kind: structural
    owner: "REPLACE-WITH-OWNER"

