# Traceability graph — the relation store.
#
# ANSWERS
#   how governed artifacts relate, and on what evidence. The `provenance` field is the
#   honest part: coverage computed over unverified claims is a number about a graph, not
#   about a system.
#
# DOES NOT ANSWER
#   what any artifact IS. That is requirements.yaml. An edge here names two ids and
#   asserts nothing about either.
#
# FILLED IN BADLY WHEN
#   edges are added to raise a coverage number rather than because the relation holds.
#   It is undetectable by any check in this repository — an invented edge between two
#   real ids resolves, type-checks, and counts. The other symptom is everything labelled
#   `asserted` forever: correct, but it means no rule was ever written and no human ever
#   signed anything.
#
# CHECKED BY
#   TRC-001 rejects a duplicate (from, relation, to) triple, TRC-002 fails an endpoint
#   that does not resolve, TRC-003 rejects a relation outside the closed vocabulary or
#   between illegal types, TRC-004 rejects cycles, TRC-005 and TRC-007 fail forward and
#   backward coverage below threshold, TRC-008 reports orphans, TRC-009 fails an
#   under-provenanced edge on a BASELINED artifact, TRC-010 RE-RUNS the rule behind a
#   `derived` edge and fails any it does not reproduce, and TRC-013 warns when an
#   `approved` edge no longer matches what was approved, which stops it counting as
#   evidence. NOTHING can tell a true asserted edge from a plausible invented one.
#
# AUTHORITY
#   anyone may assert an edge; only a named human can approve one, and approve_edge.py
#   is the only correct way to record that.
#
# Edges are stored ONCE, in active voice. The inverse direction is DERIVED at load time and
# must never be written here: two hand-maintained directions are two things that can
# disagree, and disagreement is exactly what traceability exists to prevent.
#
# Closed vocabulary (a relation outside it is an error). Inverse shown in brackets:
#   refines [refined-by]        contains [contained-by]     implements [implemented-by]
#   verifies [verified-by]      executes [executed-by]      tests [tested-by]
#   conforms-to [conformed-by]
#   validates [validated-by]    mitigates [mitigated-by]    evidences [evidenced-by]
#   depends-on [depended-on-by] belongs-to [owns]           approves [approved-by]
#   supersedes [superseded-by]
#
# provenance is required on every edge and is the honest part of this file:
#   derived   recomputed from the filesystem by a rule in derivers.py. These do NOT belong in
#             this file — they live in derived.yaml, which derive_edges.py --write rewrites in
#             full. TRC-010 re-runs the rule and fails any edge it does not reproduce, so
#             writing one here by hand cannot make it true; it only makes the graph fail.
#   asserted  claimed by an agent or author. Not independently reproducible. This is the
#             correct label for everything in this file.
#   approved  asserted, then signed off by a named human. Do NOT hand-write one: the required
#             approved_endpoints_hash binds the signature to the endpoints as they stand, and
#             TRC-013 recomputes it, so editing either endpoint downgrades the edge out of the
#             count the release gate scores. Record one with:
#               python3 .specify/extensions/openup/scripts/python/approve_edge.py \
#                 --from REQ-DOMAIN-0001 --relation refines --to BUS-OBJ-0001 --by product-owner

schema_version: "1.0"
scope: ".specify"

edges: []

# - from: REQ-DOMAIN-0001
#   relation: refines
#   to: BUS-OBJ-0001
#   provenance: asserted
#
# - from: WBS-1.2.3.4.1.1.1
#   relation: implements
#   to: REQ-DOMAIN-0001
#   provenance: asserted
#
# - from: AC-DOMAIN-0001-0001
#   relation: verifies
#   to: REQ-DOMAIN-0001
#   provenance: asserted
#
#
# No `derived` example here on purpose. To add derived edges, tag the filesystem the rules read
# (a @SCEN-/@AC- tag, a test file named after its subject, an `iteration:` on a WBS node) and run:
#
#   python .specify/extensions/openup/scripts/python/derive_edges.py --write
