# Traceability graph — the relation store.
#
# Edges are stored ONCE, in active voice. The inverse direction is DERIVED at load time and
# must never be written here: two hand-maintained directions are two things that can
# disagree, and disagreement is exactly what traceability exists to prevent.
#
# Closed vocabulary (a relation outside it is an error). Inverse shown in brackets:
#   refines [refined-by]        contains [contained-by]     decomposes-to [decomposed-from]
#   implements [implemented-by] modifies [modified-by]      verifies [verified-by]
#   executes [executed-by]      tests [tested-by]           conforms-to [conformed-by]
#   validates [validated-by]    mitigates [mitigated-by]    evidences [evidenced-by]
#   depends-on [depended-on-by] belongs-to [owns]           approves [approved-by]
#   supersedes [superseded-by]
#
# provenance is required on every edge and is the honest part of this file:
#   derived   recomputed from the filesystem by a rule in derivers.py. These do NOT belong in
#             this file — they live in derived.yaml, which derive_edges.py --write rewrites in
#             full. TRC-010 re-runs the rule and fails any edge it does not reproduce, so
#             writing one here by hand cannot make it true; it only makes the graph fail.
#   asserted  claimed by an agent or author. Not independently reproducible. This is the
#             correct label for everything in this file.
#   approved  asserted, then signed off by a named human. Requires approval and
#             approved_endpoints_hash, so editing an endpoint downgrades the edge.

schema_version: "1.0"
scope: ".specify"

edges: []

# - from: REQ-DOMAIN-0001
#   relation: refines
#   to: BUS-OBJ-0001
#   provenance: asserted
#
# - from: WBS-1.2.3.4.1.1.1
#   relation: implements
#   to: REQ-DOMAIN-0001
#   provenance: asserted
#
# - from: AC-DOMAIN-0001-0001
#   relation: verifies
#   to: REQ-DOMAIN-0001
#   provenance: asserted
#
#
# No `derived` example here on purpose. To add derived edges, tag the filesystem the rules read
# (a @SCEN-/@AC- tag, a test file named after its subject, an `iteration:` on a WBS node) and run:
#
#   python .specify/extensions/openup/scripts/python/derive_edges.py --write
