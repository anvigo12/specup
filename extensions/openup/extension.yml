schema_version: "1.0"

extension:
  id: openup
  name: "OpenUP Governed Lifecycle"
  version: "0.1.2"
  description: "Adds the OpenUP lifecycle to Spec Kit: phases, iterations, a seven-level WBS, an executable risk register, bi-directional traceability, and machine-checkable milestone gates."
  category: "process"
  effect: "read-write"
  author: "Aniket Gore"
  repository: "https://github.com/anvigo12/specup"
  license: "MIT"

requires:
  # 1.0.6 is the only Spec Kit this has ever been run against, and the floor states what
  # was exercised rather than what might work. An earlier floor (0.9.0 was the first
  # release whose bundle manifest could compose this extension with the preset and the
  # phase workflows) would be an untested claim, which is the exact defect the gates in
  # this extension exist to reject. Widen it after testing the wider range, not before.
  speckit_version: ">=1.0.0,<2.0.0"
  tools:
    - name: python
      version: ">=3.10"
      required: true
  # Python packages the validators need. Install with:
  #   python3 -m pip install -r .specify/extensions/openup/requirements.txt
  # into the interpreter the workflow shell steps invoke. If they are absent every
  # validator exits 2, so a workflow halts on its setup-fault branch rather than
  # treating the gate as passed.

provides:
  commands:
    - name: speckit.openup.init
      file: commands/speckit.openup.init.md
      description: "Scaffold the OpenUP governance tree: lifecycle, WBS, risks, traceability, evidence"

    - name: speckit.openup.phase
      file: commands/speckit.openup.phase.md
      description: "Show or advance the OpenUP phase; advancing requires the phase gate to pass"

    - name: speckit.openup.iteration
      file: commands/speckit.openup.iteration.md
      description: "Open, review, or close an iteration within the current phase"

    - name: speckit.openup.wbs
      file: commands/speckit.openup.wbs.md
      description: "Create or update the seven-level Work Breakdown Structure and regenerate wbs.md"

    - name: speckit.openup.risk
      file: commands/speckit.openup.risk.md
      description: "Create or update the risk register and bind high-exposure risks to mitigation work"

    - name: speckit.openup.trace
      file: commands/speckit.openup.trace.md
      description: "Build, derive, and validate the bi-directional traceability graph"

    - name: speckit.openup.behavior
      file: commands/speckit.openup.behavior.md
      description: "Write Gherkin scenarios bound by tag to acceptance criteria and requirements"

    - name: speckit.openup.gate
      file: commands/speckit.openup.gate.md
      description: "Evaluate a lifecycle gate against evidence and report which conditions fail"

    - name: speckit.openup.audit
      file: commands/speckit.openup.audit.md
      description: "Filesystem-first compliance audit with coverage, orphans, and evidence quality"

  templates:
    - name: openup-wbs
      file: templates/wbs-template.yaml
      description: "Seven-level WBS starter with the level semantics documented inline"

    - name: openup-risk-register
      file: templates/risk-register-template.yaml
      description: "Risk register starter with the mitigation and verification contract"

    - name: openup-requirements
      file: templates/requirements-template.yaml
      description: "Governed artifact registry starter"

    - name: openup-traceability
      file: templates/traceability-template.yaml
      description: "Relation store starter with the closed vocabulary and provenance rules"

    - name: openup-vision
      file: templates/vision-template.md
      description: "Inception vision document"

    - name: openup-stakeholders
      file: templates/stakeholders-template.md
      description: "Stakeholders and human approval boundaries"

    - name: openup-index
      file: templates/index-template.md
      description: "Directory context map for progressive disclosure"

    # Both seed as templates rather than as the documents themselves. `architecture_baselined`
    # checks only that `architecture.md` exists, so seeding a blank one would retire the gate's
    # first condition on day one while the document still said nothing. A template in place
    # gives an author somewhere to start and leaves the gate telling the truth.
    - name: openup-architecture
      file: templates/architecture-template.md
      description: "The architecture document the Elaboration gate looks for, and what it must name"

    - name: openup-adr
      file: templates/adr-template.md
      description: "One architecture decision: forces, options rejected, costs, and when to revisit it"

    # The other three governance documents (definition-of-ready, definition-of-done,
    # quality-gates) have no template on purpose: render_views.py generates them from the
    # code that enforces them, so the document and the check cannot drift.
    - name: openup-approval-matrix
      file: templates/approval-matrix-template.md
      description: "Who may approve what, per s59's human approval boundaries"

    - name: openup-allowed-signers
      file: templates/allowed-signers-template.txt
      description: "The trust root APV-002 verifies an approval's signed commit against"

    - name: openup-change-control
      file: templates/change-control-template.md
      description: "How a change to a baselined artifact is assessed, approved and absorbed"

    # The three binding standards. They are prompt-level rules, enforced at review rather than
    # by a validator, and each says so in its own closing section. They ship here so that
    # every project installing this extension gets the same standard, instead of each one
    # re-deciding what "good" means the first time an agent writes a requirement.
    - name: openup-language-rules
      file: templates/language-rules-template.md
      description: "ASD-STE100 Simplified Technical English for every governed document"

    - name: openup-coding-rules
      file: templates/coding-rules-template.md
      description: "Railway Oriented Programming, and RFC 9457 problem details at the boundary"

    - name: openup-security-practices
      file: templates/security-practices-template.md
      description: "The standard the two security gate conditions are reviewed against"

    - name: openup-agents-root
      file: templates/agents-root-template.md
      description: "s7 agent operating contract for the repository root"

    - name: openup-agents-specify
      file: templates/agents-specify-template.md
      description: "s7 operating contract scoped to the .specify governance tree"

    - name: openup-agents-src
      file: templates/agents-src-template.md
      description: "s7 operating contract scoped to implementation code"

  scripts:
    - name: openup-init
      file: scripts/python/init_openup.py
      description: "Scaffold the governance tree; never overwrites authored content"
      runtimes: [python]

    - name: openup-model
      file: scripts/python/openup_model.py
      description: "Shared graph loading, indexing, and verdict types"
      runtimes: [python]

    - name: validate-wbs
      file: scripts/python/validate_wbs.py
      description: "Validate WBS structure, depth policy, and reference resolution"
      runtimes: [python]

    - name: validate-risk
      file: scripts/python/validate_risk.py
      description: "Validate risk exposure arithmetic, mitigation, and verification"
      runtimes: [python]

    - name: validate-trace
      file: scripts/python/validate_trace.py
      description: "Validate the traceability graph, coverage, orphans, and provenance"
      runtimes: [python]

    - name: openup-derivers
      file: scripts/python/derivers.py
      description: "The derivation rules that recompute 'derived' edges from the filesystem"
      runtimes: [python]

    - name: derive-edges
      file: scripts/python/derive_edges.py
      description: "Report or regenerate the machine-derivable traceability edges"
      runtimes: [python]

    - name: approve-edge
      file: scripts/python/approve_edge.py
      description: "Record a human approval on one edge, binding it to the content approved"
      runtimes: [python]

    - name: render-views
      file: scripts/python/render_views.py
      description: "Generate wbs.md, risk-register.md, traceability.md, coverage.md and the governance documents from the canonical YAML"
      runtimes: [python]

    - name: impact
      file: scripts/python/impact.py
      description: "Report what a change to one artifact reaches, in both directions (s52)"
      runtimes: [python]

    - name: validate-approvals
      file: scripts/python/validate_approvals.py
      description: "Verify that approvals bind a named human, by a signed commit git can check"
      runtimes: [python]

    - name: validate-context
      file: scripts/python/validate_context.py
      description: "Validate the AGENTS.md / index.md / SKILL.md hierarchy and its references"
      runtimes: [python]

    - name: validate-docs
      file: scripts/python/validate_docs.py
      description: "Check that a docstring is the whole working context for the unit it documents"
      runtimes: [python]

    - name: validate-done
      file: scripts/python/validate_done.py
      description: "Check the Definition of Done against the graph for every node claiming done"
      runtimes: [python]

    - name: select-work
      file: scripts/python/select_work.py
      description: "Select Definition-of-Ready work for the current iteration, ordered risk-first"
      runtimes: [python]

    - name: evaluate-gate
      file: scripts/python/evaluate_gate.py
      description: "Evaluate a named lifecycle gate's conditions against evidence"
      runtimes: [python]

    - name: openup-audit
      file: scripts/python/audit.py
      description: "Aggregate compliance audit across every validator and the current gate"
      runtimes: [python]

  config:
    - name: "openup-config.yml"
      template: "openup-config.yml"
      description: "Lifecycle position, WBS depth policy, risk thresholds, traceability perimeter, gate definitions"
      required: true

# Hooks keep the governed graph current as the core workflow runs. They are ERGONOMIC,
# not enforcement: a hook is rendered as an instruction into the command prompt and an
# agent can decline it. Hard gates live in the phase workflows' shell steps, which run
# the same validators and abort on a non-zero exit code.
hooks:
  after_specify:
    command: speckit.openup.trace
    optional: true
    prompt: "Requirements changed. Update the traceability graph?"
    description: "Keep requirement edges current after specification"

  after_plan:
    command: speckit.openup.wbs
    optional: true
    prompt: "Plan changed. Refresh the WBS from it?"
    description: "Keep the WBS aligned with the plan"

  after_tasks:
    command: speckit.openup.trace
    optional: true
    prompt: "Tasks changed. Re-derive task and WBS edges?"
    description: "Keep task edges current after task generation"

  after_implement:
    - command: speckit.openup.trace
      priority: 10
      optional: true
      prompt: "Code changed. Re-derive source-level traceability?"
      description: "Recompute derived edges from the filesystem"
    - command: speckit.openup.audit
      priority: 20
      optional: true
      prompt: "Run the compliance audit on the updated graph?"
      description: "Report coverage, orphans, and evidence quality after implementation"

tags:
  - "openup"
  - "governance"
  - "traceability"
  - "risk"
  - "wbs"
  - "lifecycle"

defaults:
  depth_policy: semantic
  high_exposure_threshold: 0.40
  forward_coverage_threshold: 1.00
  backward_coverage_threshold: 0.95
