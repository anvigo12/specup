# SpecUP / OpenUP extension configuration
#
# This file closes the values specup.md leaves undefined. Every threshold here is
# referenced by a validator; nothing in this file is decorative. Project-local overrides
# go in openup-config.local.yml (gitignored), per the Spec Kit extension config layering.

schema_version: "1.0"

lifecycle:
  # Current position in the OpenUP lifecycle. /speckit.openup.phase updates this.
  phase: INCEPTION
  iteration: null

wbs:
  # semantic (default): levels keep fixed meanings (L1 Program .. L7 Task), but a leaf may
  #   terminate above L7 when it declares terminal_reason. Resolves the contradiction between
  #   specup.md s18 ("every leaf must be L7") and s65 ("do not create seven levels of narrative").
  # strict: s18 read literally - every leaf must be L7, no exceptions.
  depth_policy: semantic

  # Levels at which a node may never be a leaf regardless of policy. L1-L3 are pure structure
  # (Program / Phase / Iteration); a leaf there means the plan is empty, not concise.
  never_terminal_above: 3

  # Warn when a single parent has more children than this - usually a missing intermediate level.
  max_children_warn: 25

  # The canonical WBS document.
  store: .specify/wbs/wbs.yaml

risk:
  # exposure = probability x impact. specup.md states this only by example (0.6 x 0.9 = 0.54)
  # and never defines "high", though s19/s32/s63 all gate on it. Defined here.
  high_exposure_threshold: 0.40
  critical_exposure_threshold: 0.65

  # Risks at or above high_exposure_threshold must have >=1 mitigation WBS node and
  # >=1 verification reference before the Elaboration gate passes.
  require_mitigation_at_or_above: high
  require_verification_at_or_above: high

  # Reject a residual exposure that is not strictly lower than current exposure unless the
  # risk is explicitly accepted - "mitigated" with unchanged exposure is a no-op.
  require_residual_reduction: true

artifacts:
  # Where the governed artifact REGISTRY lives - requirements, business objectives, user
  # stories, acceptance criteria, ADRs, contracts, tests, evidence. Everything an edge can
  # point at that is not a WBS node, a risk, or a source path is registered in one of these.
  #
  # This block used to exist only as a default inside openup_model.py, so the most-edited
  # store in the system had its location nowhere a reader of this file could find it.
  stores:
    - .specify/traceability/requirements.yaml
    # Per-feature registries, merged into the same graph at load time. An artifact defined in
    # one feature is visible to all of them: the graph is one graph.
    - specs/*/artifacts.yaml

approvals:
  # specup.md s59 reserves a class of decision for a named human. Until 0.1.2 nothing checked
  # that one had been involved: an agent could run `approve_edge.py --by product-owner` exactly
  # as a person could. validate_approvals.py checks it, and these two keys are how.

  # The trust root. A signed commit is the only thing that ties an approval to a person, and
  # this file decides whose signatures count. It is version-controlled on purpose: a trust root
  # a reviewer cannot see in the diff is one the agent could have written. Format is git's
  # `gpg.ssh.allowedSignersFile` - one `<principal> <keytype> <key>` per line.
  allowed_signers: .specify/governance/allowed-signers

  # The ratchet. A governance state at or beyond which an approval MUST be witnessed by a
  # verified signature, or null to check nothing.
  #
  # null by default, and that is a decision rather than timidity: defaulting it to BASELINED
  # would fail the first audit of every project upgrading from 0.1.1, over approvals recorded
  # before the field existed. APV-004 warns on every claimed approval regardless, so the gap is
  # visible from day one - raising this floor is the deliberate act that makes it consequential.
  #
  # Set it to BASELINED once your approvals carry commits. Raise it as a decision; never lower
  # it to make a run go green.
  require_witness_at_or_above: null

docs:
  # DOC-000..006, in validate_docs.py. The last step of progressive disclosure: an agent that
  # opens one function gets its docstring and nothing else, so the docstring has to be the
  # whole working context for that unit — anchored to a governing artifact, bounded by what
  # the unit will not do, honest about what it claims to have cross-checked, and finite.

  # The ratchet. Checks listed here FAIL; the rest WARN.
  #
  # Empty by default, for the same reason approvals.require_witness_at_or_above is null:
  # an existing codebase has public symbols nobody documented against a requirement that did
  # not exist when they were written, and failing its first audit over them teaches only that
  # this validator should be switched off. The warnings are visible from day one; promoting a
  # check is the deliberate act that makes it consequential.
  #
  # Ratchetable: DOC-001 (every exported symbol has a docstring), DOC-003 (the file anchors to
  # a governing artifact), DOC-004 (the docstring states a boundary).
  #
  # NOT listable: DOC-002 and DOC-005 already fail and cannot be lowered — a dangling id and a
  # false cross-check claim are misleading, not missing. DOC-006 is refused outright, and the
  # validator says why: failing on docstring length makes deleting the reasoning the cheapest
  # way to go green, and the reasoning is the part worth keeping.
  enforce: []

  # DOC-006's bound. A docstring longer than this is carrying an argument, which is an ADR in
  # disguise; move it and link the ADR, which DOC-003 then anchors to.
  max_docstring_lines: 40

traceability:
  # Where relation stores live. All matching files are merged into ONE graph at load time.
  # specup.md s5 puts WBS/risk/traceability at BOTH .specify/ and specs/<feature>/ without
  # saying which is canonical; this setting is the answer - every listed store is canonical
  # for its own scope, and a duplicate (from, relation, to) triple across stores is an error.
  stores:
    - .specify/traceability/traceability.yaml
    - specs/*/traceability/matrix.yaml
    # Machine-owned. derive_edges.py --write regenerates this file wholesale from the
    # implemented derivation rules; never hand-edit it. Keeping it separate is what lets
    # a derived edge be *reproduced* rather than merely *labelled* (TRC-010).
    - .specify/traceability/derived.yaml

  # The traceability perimeter. s54 flags every untraced source file as an orphan, which at
  # file granularity would require an edge for every util, config, and generated file.
  # Only files matching include and not matching exclude are subject to backward coverage.
  perimeter:
    include:
      - "src/**"
      - "services/**"
      - "apps/**"
    #
    # AGENTS.md, index.md and SKILL.md are ALWAYS outside the perimeter and are not listed
    # here: the governance layer is not implementation, and an exclude list replaces rather
    # than merges, so a project with its own list would otherwise start failing backward
    # coverage the moment it adopted the s7/s9 context hierarchy.
    exclude:
      - "**/*.generated.*"
      - "**/__snapshots__/**"
      - "**/node_modules/**"
      # Keep these in step with testing.stem_suffixes / stem_prefixes below. A test file that
      # a derivation rule recognises but the perimeter does not is counted twice over: it
      # derives a `tests` edge AND reports as an untraced source file, so backward coverage
      # falls every time someone adds a test.
      - "**/*.test.*"
      - "**/*.spec.*"
      - "**/*_test.*"
      - "**/*_spec.*"
      - "**/*-test.*"
      - "**/*Test.*"
      - "**/test_*.*"
      - "**/test-*.*"

  coverage_thresholds:
    forward: 1.00   # every requirement reaches implementation and verification
    backward: 0.95  # every in-perimeter source file reaches a requirement

  # Minimum provenance for edges touching a BASELINED artifact. Below this, the audit reports
  # the coverage figure but the gate does not accept it as evidence.
  baseline_min_provenance: approved

gherkin:
  features_glob: "specs/*/acceptance/**/*.feature"
  # s24: every acceptance criterion has >=1 scenario, and every scenario maps back to an AC
  # and a requirement. Scenario binding is by @TAG using the ID grammar. Each scenario also
  # carries its own @SCEN-<DOMAIN>-nnnn tag: that tag is the scenario's identity in the graph,
  # and without it gherkin-tag-scan has nothing to hang the `executes` edge on.
  require_ac_tag: true
  require_requirement_tag: true
  # TRC-012. s24 read strictly: an acceptance criterion nobody wrote a scenario for has not
  # been specified, only asserted.
  require_scenario_per_ac: true

testing:
  # How test-file-naming-convention maps a registered test artifact's `source` file to the
  # file it tests: strip one marker from the stem, then look for that stem with the SAME
  # extension inside the traceability perimeter. Zero or several matches derive nothing and
  # say why — a guess here would be an asserted edge wearing a derived label.
  stem_suffixes: [".test", ".spec", "_test", "_spec", "-test", "Test"]
  stem_prefixes: ["test_", "test-"]

contracts:
  # NOT YET READ BY ANY VALIDATOR. Declared so the shape is settled, but no code globs these
  # and no code parses an OpenAPI or AsyncAPI document. The only contract check that runs is
  # `critical_contracts_defined`, which asserts a registered CONTRACT-* artifact's `source`
  # file exists — it does not open it. Do not read this block as "contracts are validated".
  openapi_glob: "specs/*/contracts/*.openapi.{yaml,yml,json}"
  asyncapi_glob: "specs/*/contracts/*.asyncapi.{yaml,yml,json}"
  # Microcks conformance is deferred to a later phase (specup.md's own Maturity Level 4,
  # s64) because it needs a reachable server. This flag is inert until then.
  microcks:
    enabled: false

gates:
  # Named predicates implemented in scripts/python/evaluate_gate.py. specup.md s30 names these
  # but never defines them; the mapping from name to implementation lives in that module.
  GATE-LIFECYCLE_OBJECTIVES:
    phase: INCEPTION
    conditions:
      - vision_present
      - stakeholders_identified
      - initial_risks_registered
      - wbs_levels_1_to_3_valid
      - requirements_have_owners

  GATE-LIFECYCLE_ARCHITECTURE:
    phase: ELABORATION
    conditions:
      - architecture_baselined
      - all_high_risks_have_mitigation
      - requirements_traceable
      - critical_contracts_defined
      - security_review_complete
      - wbs_valid
      - human_approvals_witnessed

  GATE-INITIAL_OPERATIONAL_CAPABILITY:
    phase: CONSTRUCTION
    conditions:
      - wbs_valid
      - forward_coverage_met
      - backward_coverage_met
      - acceptance_scenarios_passing
      - definition_of_done_met
      - no_open_critical_risks
      - no_orphans

  GATE-PRODUCT_RELEASE:
    phase: TRANSITION
    conditions:
      - all_gates_passed
      - release_evidence_complete
      - no_open_high_risks
      - traceability_final
      - security_validation_passed
      - human_approvals_witnessed

audit:
  # s33 report. The provenance mix is always emitted and is deliberately NOT configurable:
  # a graph that is overwhelmingly 'asserted' must not be able to present itself as fully
  # covered, and a flag to suppress that would be a switch for turning off the honesty.
  fail_on:
    - broken_references
    - orphan_requirements
    - orphan_wbs_nodes
    - unmitigated_high_risk
    - coverage_below_threshold
    # DOC-002 fails on its own, so listing it here changes no outcome. It is named so the
    # audit's Reasons block says which docstring pointed at what, instead of leaving a reader
    # to find it in the docs section.
    - dangling_docstring_anchor
