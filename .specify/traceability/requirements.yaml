# SpecUP's own governed artifact registry.
#
# ANSWERS
#   what SpecUP is obliged to do, where that obligation comes from, and who owns it.
#
# DOES NOT ANSWER
#   how any of it relates. That is traceability.yaml.
#
# FILLED IN BADLY WHEN
#   a requirement is written FROM the code it is meant to govern. That is the failure this
#   registry came closest to committing, and it is worth naming precisely.
#
#   Every module in the perimeter already states, in its own module docstring, which
#   specup.md section it answers to. Recovering a requirement from that docstring would have
#   been fast and would have produced a graph where the requirement, the implementation and
#   the check all descend from one reading — they would agree because they share an origin,
#   which is the independent-oracle failure the ADR template warns about.
#
#   So each requirement below was written from the specup.md section, and the docstring was
#   used only to find WHICH section to read. That is a weaker independence than it sounds:
#   the pointer came from the code. What it buys is that the requirement says what §N
#   obliges rather than what the module happens to do, so the two can now disagree — and a
#   requirement that cannot disagree with its implementation is not governing anything.
#
# CHECKED BY
#   TRC-002 fails an edge pointing at an unregistered id; requirements_have_owners fails the
#   Inception gate over a missing owner; DOC-002 fails a docstring naming an id that is not
#   here. NOTHING checks that a requirement is a true reading of the section it cites. That
#   is a human reading, and `.specify/governance/approval-matrix.md` says whose.
#
# AUTHORITY
#   the maintainer. Moving anything here past REVIEW needs a recorded approval, and SpecUP
#   has no second signer to record one — see RISK-0001.
#
# ---------------------------------------------------------------------------
# WHY EVERYTHING IS AT `REVIEW`, INCLUDING REQUIREMENTS WHOSE CODE HAS SHIPPED.
#
# `docs/guide/existing-project.md` suggests `APPROVED` for recovered requirements on the
# grounds that the behaviour "is already built and in production". That conflates two
# different objects. The CODE is shipped. The STATEMENT OF INTENT below was written today, by
# recovery, and nobody has read it against the section it cites. Marking it APPROVED would
# record a review that did not happen, which is the one thing `specup.md` §31 is about:
# generated does not mean approved.
#
# REVIEW is the accurate state and it has a visible cost — `baseline_min_provenance` never
# engages, so TRC-009 checks nothing here. That cost is the correct one to pay.

schema_version: "1.0"

artifacts:

  # -- why SpecUP exists ----------------------------------------------------------------

  - id: BUS-OBJ-0001
    type: business-objective
    title: "A claim made in a governed repository can be checked by a machine instead of believed"
    status: REVIEW
    owner: "maintainer"
    priority: critical
    source: specup.md
    cites:
      - document: "specup.md"
        clause: "§3 Core Design Principle, §71 Architectural Thesis"
        value: "governance is only real when it is machine-checkable and consequential"
    # Falsifiable in one direction only, which is the honest shape for an objective: a single
    # governance claim that no check can reach contradicts it. SpecUP currently has several,
    # and they are written down rather than smoothed over — see the Limitations section of
    # README.md and the `contracts:` block of the config.

  # -- the obligations, one per specup.md section that has code behind it ----------------
  #
  # Ordered by the section they recover, not by importance. Every `source:` is a path a
  # reader can open; every `cites.clause` is the part of it that was read.

  - id: REQ-WBS-0001
    type: requirement
    title: "Work breakdown invariants that no JSON Schema can express must be enforced against the graph"
    status: REVIEW
    owner: "maintainer"
    priority: high
    source: specup.md
    cites:
      - document: "specup.md"
        clause: "§18 WBS Invariants, §32 Governance Invariants"
        value: "single parent, level agrees with the dotted id, a risk-mitigation node names a risk"
    # §18 and §65 contradict each other on depth — every leaf at L7 versus "do not create
    # seven levels of narrative". The requirement deliberately does not pick a side: the
    # choice is a configured policy (`wbs.depth_policy`) and the config is where it is
    # recorded, because both readings are defensible and a project has to be able to say
    # which one it took.

  - id: REQ-RISK-0001
    type: requirement
    title: "A risk at or above the configured exposure threshold must reach real work and a way to prove the reduction"
    status: REVIEW
    owner: "maintainer"
    priority: high
    source: specup.md
    cites:
      - document: "specup.md"
        clause: "§19 Risk Register, §32 Risk invariant, §39 Risk-Driven Planning"
        value: "the register is not passive documentation"
    # §19 never defines "high". The threshold is a configured number, and that is stated in
    # the requirement rather than hidden in it: a requirement that named 0.40 would make
    # every project that chose a different number non-conformant to SpecUP's own spec.

  - id: REQ-TRACE-0001
    type: requirement
    title: "Traceability must answer in both directions from one stored direction"
    status: REVIEW
    owner: "maintainer"
    priority: critical
    source: specup.md
    cites:
      - document: "specup.md"
        clause: "§20 Bi-Directional Traceability, §21 Machine-Readable Model, §22"
        value: "what implements this requirement, and what requirements does this file affect"
    # The "from one stored direction" clause is the requirement's whole content. Two
    # hand-maintained datasets would satisfy §20 read literally and would drift, which §22 is
    # about. Storing active voice and deriving the inverse is what makes drift impossible
    # rather than merely discouraged.

  - id: REQ-TRACE-0002
    type: requirement
    title: "Coverage must be computed over a declared perimeter, and every untraced in-perimeter file reported"
    status: REVIEW
    owner: "maintainer"
    priority: high
    source: specup.md
    cites:
      - document: "specup.md"
        clause: "§53 Traceability Coverage Metrics, §54 Orphan Detection"
        value: "forward, backward and verification coverage; orphan artifacts are a finding"
    # §54 flags every untraced source file. At file granularity over a whole repository that
    # is unusable, so the perimeter is what makes the check survivable — and the perimeter is
    # also how a project makes its coverage figure meaningless without lying. Nothing checks
    # a perimeter for honesty. `.specify/extensions/openup/openup-config.yml` says so beside
    # SpecUP's own.

  - id: REQ-TRACE-0003
    type: requirement
    title: "An edge marked `derived` must be reproducible by a named rule, and one that is not must be reported"
    status: REVIEW
    owner: "maintainer"
    priority: critical
    source: extensions/openup/schemas/ID-GRAMMAR.md
    cites:
      - document: "extensions/openup/schemas/ID-GRAMMAR.md"
        clause: "§3 Provenance"
        value: "the agent that writes the code is otherwise the agent that writes the proof"
    # The one requirement here whose source is not specup.md. §21 requires `derived_by` to be
    # present and never that it be true, so the obligation had to be authored rather than
    # recovered — ID-GRAMMAR.md is where it was authored, and citing specup.md for it would
    # claim a normative basis that does not exist.

  - id: REQ-DONE-0001
    type: requirement
    title: "A work item is done only when the graph computes it done, never when a status field says so"
    status: REVIEW
    owner: "maintainer"
    priority: critical
    source: specup.md
    cites:
      - document: "specup.md"
        clause: "§29 Definition of Done, §31 Governance States"
        value: "DONE is a computed governance state rather than a casual AI declaration"

  - id: REQ-READY-0001
    type: requirement
    title: "A task is executable only when it satisfies the Definition of Ready, and the highest-exposure ready work comes first"
    status: REVIEW
    owner: "maintainer"
    priority: medium
    source: specup.md
    cites:
      - document: "specup.md"
        clause: "§28 Definition of Ready, §39 Risk-Driven Planning"
        value: "a task is not executable merely because it exists"

  - id: REQ-GATE-0001
    type: requirement
    title: "Every gate condition must be a predicate a machine evaluates and a name in configuration must resolve to one"
    status: REVIEW
    owner: "maintainer"
    priority: critical
    source: specup.md
    cites:
      - document: "specup.md"
        clause: "§30 Lifecycle and Quality Gates, §55 Quality Gate Philosophy"
        value: "a gate must be machine-checkable and evidence-producing"
    # The second clause is the one that bites: §30 names conditions and never implements
    # them, so a project could name anything. A condition with no predicate behind it fails
    # GATE-000 rather than passing silently, which is the difference between a gate and a
    # heading.

  - id: REQ-AUDIT-0001
    type: requirement
    title: "The governance state of a repository must be observable in one report rather than inferred from several"
    status: REVIEW
    owner: "maintainer"
    priority: high
    source: specup.md
    cites:
      - document: "specup.md"
        clause: "§33 /speckit.audit"
        value: "one filesystem-first compliance report"

  - id: REQ-VIEW-0001
    type: requirement
    title: "Human-readable governance views must be generated from the canonical machine-readable stores"
    status: REVIEW
    owner: "maintainer"
    priority: medium
    source: specup.md
    cites:
      - document: "specup.md"
        clause: "§47 Generated Views, §65 Avoiding Process Bloat"
        value: "do not manually maintain traceability documents"

  - id: REQ-CTX-0001
    type: requirement
    title: "Every governed directory must be navigable as directory to operating contract to context map to one artifact, and every id on that path must resolve"
    status: REVIEW
    owner: "maintainer"
    priority: high
    source: specup.md
    cites:
      - document: "specup.md"
        clause: "§9 The index.md Context Map, §56 Progressive Context, §57 Minimal Context"
        value: "an agent loads the one artifact it needs rather than the repository"

  - id: REQ-APV-0001
    type: requirement
    title: "An approval that claims a human must be checkable against a version-controlled trust root, and one that cannot be must be reported as claimed rather than witnessed"
    status: REVIEW
    owner: "maintainer"
    priority: critical
    source: specup.md
    cites:
      - document: "specup.md"
        clause: "§59 Human Approval Boundaries, §31 Governance States"
        value: "business scope, baselines, high-risk acceptance and release are reserved for a named human"
    # Closed in 0.1.2 and the README bullet that said otherwise was rewritten. The module
    # docstring in approve_edge.py was not, and still claimed "which is not implemented"
    # until this workstream read it. That is what a requirement with no anchor costs: the
    # correction landed in the document a reader finds first and nowhere else.

  - id: REQ-IMPACT-0001
    type: requirement
    title: "The set of artifacts a change reaches must be computable before the change is made"
    status: REVIEW
    owner: "maintainer"
    priority: medium
    source: specup.md
    cites:
      - document: "specup.md"
        clause: "§52 Change Impact Analysis, §22"
        value: "a computed impact set before a governed artifact is changed"

  - id: REQ-INIT-0001
    type: requirement
    title: "Scaffolding a governance tree must never overwrite authored content, and must be safe to re-run"
    status: REVIEW
    owner: "maintainer"
    priority: high
    source: specup.md
    cites:
      - document: "specup.md"
        clause: "§5 Repository Architecture, §31 Governance States"
        value: "generated does not mean approved, and its converse"
    # Verified on this repository rather than only in a fixture: the scaffold ran over a
    # populated tree in this workstream and preserved every authored file. It also seeded
    # `src/AGENTS.md` into a repository that has no `src/`, which is recorded as RISK-0004.

  - id: REQ-DOC-0001
    type: requirement
    title: "A docstring must be the complete working context for the unit it documents: anchored, bounded, honest about what it claims to have cross-checked, and finite"
    status: REVIEW
    owner: "maintainer"
    priority: high
    source: extensions/openup/scripts/python/validate_docs.py
    cites:
      - document: "specup.md"
        clause: "§56 Progressive Context Architecture, §57 Minimal Context for an L7 Task"
        value: "the agent gets the one artifact it needs and nothing else arrives"
    # AN ADDITION, NOT A RECOVERY. §56-57 argue for progressive disclosure down to the file
    # and stop there; nothing in specup.md says anything about a docstring. The extension
    # from "the one artifact" to "the one function" is SpecUP's, it is defensible, and
    # `source:` points at the module that makes it rather than at a section that does not.
    # README.md's "Corrections to specup.md" is where deviations like this are listed.

  # -- quality attributes ---------------------------------------------------------------

  - id: NON-FR-CORE-0001
    type: non-functional-requirement
    title: "Every validator must read one graph, loaded from the filesystem, with no state that is not in a file"
    status: REVIEW
    owner: "maintainer"
    priority: critical
    source: specup.md
    cites:
      - document: "specup.md"
        clause: "§4 Filesystem-First Compliance, FS-001 Filesystem Authority, FS-002 No Invisible State"
        value: "if it is not in the filesystem it does not exist"

  - id: NON-FR-CORE-0002
    type: non-functional-requirement
    title: "A run that could not be evaluated must exit 2 and must never be reported as a governance failure"
    status: REVIEW
    owner: "maintainer"
    priority: critical
    source: docs/guide/using-specup.md
    cites:
      - document: "docs/guide/using-specup.md"
        clause: "the exit-code contract"
        value: "0 pass, 1 governance failure, 2 could not evaluate"
    # Also an addition. specup.md has no exit-code contract at all, and the distinction it
    # draws is the one a CI branch depends on: a missing dependency reported as a FAIL tells
    # a team its governance is broken when its environment is.

  - id: NON-FR-DOCS-0001
    type: non-functional-requirement
    title: "Every check named in the operating manual must exist in the code, and every check in the code must be named in the manual"
    status: REVIEW
    owner: "maintainer"
    priority: high
    source: docs/guide/using-specup.md
    cites:
      - document: "docs/guide/using-specup.md"
        clause: "§6, the check reference"
        value: "every check id, its severity, and what it does and does not verify"
    # THE ONE REQUIREMENT HERE THAT NOTHING VERIFIES, AND IT IS LEFT THAT WAY ON PURPOSE.
    #
    # It is implemented — by WBS-1.1.2.6, the release sweep, which is a person reading both
    # sides. It is not verified: no test compares the manual with the code, so TRC-006 reports
    # 17 of 18 requirements verified and `requirements_traceable` fails on this one.
    #
    # The cheap repair is to delete this requirement, and the graph would then report 100%
    # verification over a project whose documentation has drifted four times in two releases.
    # The obligation is real whether or not it is registered; registering it is what makes the
    # gap appear in a number instead of in a memory. RISK-0002 is the same fact as a risk.

  - id: NON-FR-DIST-0001
    type: non-functional-requirement
    title: "Every distributed manifest must declare the licence the repository actually ships under"
    status: REVIEW
    owner: "maintainer"
    priority: high
    source: LICENSE
    cites:
      - document: "LICENSE"
        clause: "Parameters — Licensed Work, Change License"
        value: "SpecUP is under BUSL-1.1 with a Change License of MIT"
    # Added by the 0.1.2 relicense, and it is the only requirement here whose source is not a
    # specification. That is deliberate: the obligation is not something specup.md imposes, it
    # is something distribution imposes. `tools/build_catalog.py` copies each manifest's
    # `license` field into the published catalog through its PASSTHROUGH tuple, whose own
    # comment says everything in it is display-only to Spec Kit — nothing downstream checks it
    # and nothing upstream did either.
    #
    # So a manifest left at "MIT" after the relicense would have been republished as a public
    # statement of terms that are no longer the terms, in a repository whose argument is that
    # an unchecked claim is the defect. Seven manifests, one licence file, and a human
    # remembering all eight was the whole control. UNIT-LIC-0001 is now the control.

  # -- evidence the risk register points at ---------------------------------------------

  - id: EVID-0006
    type: evidence
    title: "Generated coverage view — the derived-edge counts SpecUP cannot fake"
    status: REVIEW
    owner: "maintainer"
    source: .specify/traceability/coverage.md
    # `derived_verified` counts edges a rule reproduced from the filesystem on the run that
    # wrote this document. Relabelling an edge `derived` does not raise it — TRC-010 fails the
    # edge instead. That is why RISK-0003's verification reference is a generated document
    # rather than a test: the test would assert its own premise.

  # -- the test suite, as governed artifacts ---------------------------------------------
  #
  # Registered so that verification is a graph fact rather than a claim in a README. Each
  # `source` is a real file; the `verifies` edges are in traceability.yaml.
  #
  # THESE ARE ASSERTED AND CANNOT BE DERIVED, AND THE REASON IS SPECIFIC TO THIS REPOSITORY.
  # `test-file-naming-convention` strips a configured marker from the test file's stem and
  # looks for that stem inside the perimeter — `tests/test_docs.py` therefore asks for
  # `docs.py`, and the module it actually exercises is `validate_docs.py`. SpecUP names its
  # test files after the behaviour under test rather than after the module, so its own
  # derivation rule reproduces none of its own `tests` edges. See RISK-0003.

  - id: UNIT-CORE-0001
    type: unit-test
    title: "Validator behaviour over a mutated good fixture (99 tests)"
    status: REVIEW
    owner: "maintainer"
    source: tests/test_validators.py

  - id: UNIT-DRV-0001
    type: unit-test
    title: "Derivation rules and the derived store (25 tests)"
    status: REVIEW
    owner: "maintainer"
    source: tests/test_derivers.py

  - id: UNIT-APV-0001
    type: unit-test
    title: "Approval verification against a real signed commit (15 tests)"
    status: REVIEW
    owner: "maintainer"
    source: tests/test_approvals.py

  - id: UNIT-DOC-0001
    type: unit-test
    title: "The docstring contract, DOC-000 to DOC-006 (33 tests)"
    status: REVIEW
    owner: "maintainer"
    source: tests/test_docs.py

  - id: UNIT-INIT-0001
    type: unit-test
    title: "Scaffolding and view generation over a populated tree (8 tests)"
    status: REVIEW
    owner: "maintainer"
    source: tests/test_init.py

  - id: UNIT-LIC-0001
    type: unit-test
    title: "Manifest licence fields against the licence on disk (10 tests)"
    status: REVIEW
    owner: "maintainer"
    source: tests/test_license.py
    # Reads LICENSE and requires the seven manifests to agree with it, rather than asserting
    # the string "BUSL-1.1". A test that hardcoded the current licence would have to be edited
    # by the same person making the next relicense, in the same sitting, which is how a check
    # becomes a formality.

  # -- evidence --------------------------------------------------------------------------
  #
  # What a WBS node marked `done` points at. DOD-001 checks that each reference resolves; it
  # does not open the file, so evidence here is a pointer a reviewer can follow rather than
  # anything the machine has read.

  - id: EVID-0001
    type: evidence
    title: "SpecUP 0.1.1 release notes"
    status: REVIEW
    owner: "maintainer"
    source: docs/runbooks/release-notes-0.1.1.md

  - id: EVID-0002
    type: evidence
    title: "Approval verification: the validator and its end-to-end signature tests"
    status: REVIEW
    owner: "maintainer"
    source: extensions/openup/scripts/python/validate_approvals.py

  - id: EVID-0003
    type: evidence
    title: "The docstring contract: the validator and its tests"
    status: REVIEW
    owner: "maintainer"
    source: extensions/openup/scripts/python/validate_docs.py

  - id: EVID-0004
    type: evidence
    title: "Templates carrying the five-slot frame, asserted by tests/test_templates.py"
    status: REVIEW
    owner: "maintainer"
    source: tests/test_templates.py

  - id: EVID-0005
    type: evidence
    title: "The worked example, pinned to the exact set of conditions it fails"
    status: REVIEW
    owner: "maintainer"
    source: tests/test_examples.py

  - id: EVID-0007
    type: evidence
    title: "The licence position: BUSL-1.1, its Change License, and what it costs"
    status: REVIEW
    owner: "maintainer"
    source: docs/dev/licensing.md
    # A document rather than a test, because the part a reviewer has to check is not whether
    # the manifests agree — UNIT-LIC-0001 does that — but whether the claims around the change
    # are true: that 0.1.0 and 0.1.1 stay MIT, that Apache-2.0 would have breached BUSL
    # covenant 1, and that the Spec Kit listing is lost. None of those is machine-checkable
    # and all three are load-bearing.

  - id: EVID-0008
    type: evidence
    title: "The 0.1.3 agent stack, researched from sources before any of it is built"
    status: REVIEW
    owner: "maintainer"
    source: docs/research/specup-agent-stack.md
    # Evidence for an iteration that has no requirements yet, which is why this is the only
    # thing registered for it. What a reviewer has to check is whether the claims are true —
    # that NVIDIA OpenShell is Apache-2.0 and attests its policy by hash, that Vouch Protocol
    # is Apache-2.0 while its own dependency jwcrypto is LGPL-3.0-or-later, that the Neo4j
    # drivers are Apache-2.0 while the Bolt specification documentation is CC BY-NC-SA 4.0,
    # that jina-reranker-v3 and splade-v3 are non-commercial and EmbeddingGemma is not OSI,
    # that Aegra pulls in none of the Elastic-licensed packages, that Langfuse is now owned by
    # ClickHouse — and nothing here can check any of that. The report says so itself and cites
    # each source so the reading can be repeated, which is the only verification a document of
    # this kind offers.
    #
    # The report is no longer purely research. It now records TEN DECISIONS taken by the
    # project owner, marked `Decided` where they land, and they are the part of this artifact
    # most in need of a second reading. The load-bearing one is decision 1: SpecUP composes
    # this stack and redistributes none of it. Most of section 7 rests on that single ruling,
    # so if it is ever quietly broken — an appliance, a bundled image, a vendored component —
    # the licence analysis in this evidence stops being true and nothing will say so. Decisions
    # in a research document have no id, no status and no verifier. Each should become an ADR.
    #
    # Decision 8 is not like the other seven and should be reviewed differently. It adopts the
    # twelve-factor methodology as extended to fifteen by Beyond the Twelve-Factor App, which
    # means it constrains components that do not exist yet rather than settling one that does.
    # Section 11 scores the stack against all fifteen and does not pass: four factors cannot be
    # met as written, one — factor II, no reliance on system-wide packages — is violated
    # permanently by OpenShell's host daemon, and three of section 9's gaps are reclassified as
    # named factor violations. A reviewer should check that the scoring is honest rather than
    # flattering, because a methodology adopted and then quietly graded on a curve is worse
    # than one never adopted. Two findings there are load-bearing elsewhere: factor III's own
    # definition of config resolves the NON-FR-CORE-0001 conflict in this project's favour, and
    # factor V's release id is the index provenance section 9 lists as missing.
    #
    # Decision 8 is also the only one of the eight that produces mechanically checkable
    # obligations — three of them, listed in section 11.7 — and none of those checks exists.
    #
    # Section 12.3 is the WEAKEST material in this artifact, and DECISION 9 ADOPTED IT. It
    # answers each of the eighteen questions from outside practice: SLSA's Source Track,
    # OWASP's Non-Human Identities Top 10, CWE-1188, SPIFFE, Sigstore's keyless model,
    # CycloneDX ML-BOM, OpenSSF Scorecard and Kubernetes RuntimeClass among them. Six of the
    # eighteen rest partly on secondary sources, and section 14 marks which. The stated ground
    # for adopting them is that the components are young and a convention many people follow is
    # a better guess than one derived here — with each answer reopening when its component
    # reaches a stable release. THAT REVISIT IS THE WHOLE JUSTIFICATION AND NOTHING SCHEDULES
    # IT. A reviewer checking this evidence should check the revisit before checking the
    # answers: "this is how the industry does it" is evidence about what is normal rather than
    # about what is correct for a governance tool, and it decays.
    #
    # Decision 10 adopts three published conventions for the GitHub surface — cbea.ms's seven
    # rules, Conventional Commits v1.0.0 (CC BY 3.0), and GitHub issue and pull request
    # templates. It is the only decision here with an enforcement mechanism that exists: a
    # commit-msg hook in .pre-commit-config.yaml. It is also the first rule this project has
    # adopted without applying it retroactively to itself — SpecUP's own git history does not
    # follow Conventional Commits and is not being rewritten.
    #
    # That research corrected two claims this evidence previously carried. First, section 9's
    # statement that the decision-to-approval binding "has no upstream" is wrong: SLSA Source
    # Track L4 is two-party review and the platform issues a Source VSA, which is the same idea
    # under another name. The surviving gap is narrower — binding a specific governance decision
    # to a specific artifact. Second, Amazon Neptune speaks Bolt with the Neo4j drivers, so
    # decision 6 reaches three servers rather than two, across self-hosted and managed models.
    #
    # One licence finding is unresolved and is recorded as unresolved: boltprotocol.org now
    # redirects to Neo4j's documentation, AWS still describes Bolt as CC BY-SA 3.0, and the
    # neo4j/docs-bolt repository file says CC BY-NC-SA 4.0 — a NonCommercial term the older
    # licence did not have. The report does not decide which governs which artifact.
    #
    # SECTION 13 IS NEW, IT TAKES NO DECISION, AND IT REOPENS THE QUESTIONS SECTION. It
    # researches how the agent improves itself — exploration policies and self-improving agent
    # systems — and produces six more questions, numbered 19 to 24, that decision 9 does not
    # cover because no established practice governs a self-improving agent inside a governance
    # tool. Everything in it is Specified or Inferred; the only Verified claims are what the
    # cited papers say, and a result on SWE-bench or WebArena is not evidence about a
    # governance tool. Read it as the weakest section in the artifact and the one most likely
    # to be quoted as though it were a plan.
    #
    # Three things in it are load-bearing for this repository rather than for the 0.1.3 stack,
    # and a reviewer should check these rather than the literature survey.
    #
    # First, the one rule: an agent may optimise what it does, and never what decides whether
    # what it did was good. Section 13.7 lands it on five paths that exist today —
    # extensions/openup/scripts/python/, .specify/governance/allowed-signers, the thresholds in
    # openup-config.yml, any approval recorded as witnessed, and rag/eval/golden/. NOTHING
    # PROTECTS ANY OF THEM FROM A PROCESS RUNNING AS THE DEVELOPER. The Darwin Gödel Machine
    # removed the markers in its own reward function and was caught only by its archive's
    # lineage; this project's equivalent lineage is git, which is one of the things the agent
    # is allowed to write to.
    #
    # Second, a consequence of decision 7 that appears nowhere else: if the evaluator is an LLM
    # it must not be the same model as the actor, because LLM judges show measurable
    # self-preference driven by familiarity rather than authorship. DOC-005 forbids exactly
    # that shape — a claim of corroboration naming one source twice — and the guide already
    # admits DOC-005 counts names rather than independence. That admission is now backed by
    # outside evidence, which makes it a gap rather than a caveat.
    #
    # Third, the cheapest item in the whole report: section 13.8 argues this project already
    # mandates three metacognitive primitives — "resolve, or stop, never infer", the third exit
    # code, and DOC-005 — and measures none of them. Emitting a telemetry event whenever
    # "resolve, or stop" fires needs no new capability, only a span, and decision 8's factor 13
    # plus answer 11 already chose the transport. If any single thing in this artifact is acted
    # on before 0.1.3 exists, it should be that one.
    #
    # Two further claims deserve a second reading, because the report builds on them.
    #
    # The OpenShell claim: the sandbox is where SpecUP's containment claim would be made
    # mechanical, and the report argues that OpenShell's hash-attested, fail-closed policy is
    # the same idea as APV-002's content-bound approval, one layer down. If that reading is
    # wrong, section 3.4 and the second row of section 10 are wrong with it.
    #
    # The Vouch claim, which is new and is the one that touches this repository's own model:
    # `vouch git init` configures SSH commit signing, so an agent's commits would satisfy
    # APV-002 the moment an agent key entered .specify/governance/allowed-signers. The report
    # names that as a trap and says the roots must stay separate. If this evidence is ever used
    # to justify adopting Vouch, that warning travels with it.
    #
    # The model-licence claims in section 7.2 remain the fastest-decaying evidence here. Model
    # cards are edited more often than LICENSE files, and the claims are expensive to get wrong
    # in either direction — a false positive rejects the best reranker available, and a false
    # negative ships a non-commercial model to a paying customer. Vouch's own version numbers
    # decay nearly as fast: its README and its published package disagreed at the time of
    # writing, and the report took the package as authoritative.
    #
    # The report now recommends THREE young components — Aegra unproven, OpenShell alpha, Vouch
    # beta — and says so in its own closing section rather than in a footnote.
    #
    # `open-swe/` is tracked from the 0.1.2 release, so this evidence no longer describes
    # something that can change without a commit. What is still unchecked is agreement between
    # the directory tree and section 1's inventory of it: nothing fails if they diverge.
    #
    # ONE CLAIM IN THIS ARTIFACT IS CORRECTED BY EVID-0009 rather than by a later reading of a
    # source. Section 13.7 named Vouch Shield as the layer that protects the governance tree
    # from the agent; the shape document shows it must be OpenShell's filesystem policy,
    # because Shield's own documentation says it cannot see symlinks. The correction is written
    # into section 13.7 in place, so a reader of this artifact meets it where the wrong claim
    # was. A reviewer should treat that as the pattern to expect: synthesising this report
    # surfaces errors that reading it section by section does not.

  - id: EVID-0009
    type: evidence
    title: "The 0.1.3 runtime shape, synthesised from EVID-0008 with its assumptions numbered"
    status: REVIEW
    owner: "maintainer"
    source: docs/research/specup-agent-shape.md
    # A synthesis of EVID-0008, not a second reading of its sources. It reorganises the same
    # twelve components by how they run — five planes, eleven processes, two lifecycles, five
    # trust boundaries, one failure matrix — and it exists because the next document,
    # docs/research/specup-agent-runtime.md, has to specify a system rather than survey one.
    #
    # WHAT A REVIEWER CHECKS HERE IS NOT WHETHER THE CLAIMS ARE TRUE. EVID-0008 carries that
    # burden and cites each source so the reading can be repeated. What this artifact must be
    # checked for is the failure that synthesis specifically invites: a coherent narrative in
    # which a reading and a guess are indistinguishable. The source report marks every claim
    # Verified, Inferred, Specified or Decided, and those markers do not survive being drawn as
    # a deployment diagram — everything in a diagram looks equally solid.
    #
    # THE MITIGATION IS THE ASSUMPTION REGISTER, AND IT IS WHAT THIS EVIDENCE ACTUALLY IS.
    # Section 9 numbers 31 assumptions, ASM-01 to ASM-31, each with where it came from and what
    # breaks if it is wrong. Thirteen are carried from EVID-0008's own Inferred markers.
    # EIGHTEEN ARE NEW: this document had to invent them to make the runtime coherent at all,
    # and nothing upstream states any of them. Those eighteen are the reviewable material. A
    # reviewer who checks one thing should check that each of the eighteen is an assumption
    # rather than a conclusion that lost its evidence on the way in.
    #
    # ASM-03 is load-bearing for the whole artifact: that Open SWE's five graphs run unchanged
    # under Aegra. Aegra's own compatibility list names Agent Chat UI, LangGraph Studio and
    # CopilotKit and does not name Open SWE. If ASM-03 is false, `agent/` is a fork rather than
    # a configuration directory, EVID-0008's decision 1 changes reach, and this document
    # describes a different system. It is also testable in an afternoon, which is the point:
    # six of the thirty-one need no new code, and none of the six has been run.
    #
    # Three findings are this artifact's own rather than EVID-0008's, and they are the reason
    # it is registered separately rather than folded in. First, the sandbox contains code
    # execution over a working tree and not the agent's reasoning — retrieval, the policy
    # broker and the trace exporter all run outside it, which makes the containment claim
    # narrower than "the agent is sandboxed" reads. Second, ASM-28: the governance tree is
    # protected by OpenShell's hash-attested filesystem policy, not by the Shield rules.
    # Third, and unsolved here: the governance tree ships inside the repository the agent
    # clones, so the validators run inside the sandbox with it, and THE EVALUATION THAT GRADES
    # THE AGENT'S WORK HAS NOWHERE TRUSTED TO RUN UNTIL CI EXISTS. There is no .github/workflows
    # in this repository.
    #
    # This is an INTERMEDIATE artifact and it says so in its own header. It is REVIEW rather
    # than BASELINED because its whole purpose is to be superseded: once the assumptions are
    # tested, docs/research/specup-agent-runtime.md replaces the shape with a specification and
    # this document becomes the record of what was assumed before anybody knew. Do not baseline
    # it, and do not cite it for a component fact — cite EVID-0008 for those.

